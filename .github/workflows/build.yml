name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'
      - name: Check shell syntax
        run: |
          for script in module/*.sh; do sh -n "$script"; done
      - name: Build and package
        run: python3 scripts/build.py --ndk "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
      - name: Verify package
        run: python3 scripts/check_package.py dist/mumu15-wechat-fix-v2.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mumu15-wechat-fix
          path: dist/*
          if-no-files-found: error
